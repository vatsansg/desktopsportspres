{# Password input with a show/hide toggle. Params: id, name, label, autocomplete #}
{% macro password_field(id, name, label, autocomplete="off", hint=None, autofocus=False, describedby=None) %}
<div class="field">
  <label for="{{ id }}">{{ label }}</label>
  <div class="input-group">
    <input id="{{ id }}" name="{{ name }}" type="password" autocomplete="{{ autocomplete }}"
           maxlength="128" required{% if autofocus %} autofocus{% endif %}{% if describedby %} aria-describedby="{{ describedby }}" aria-invalid="true"{% endif %}>
    <button type="button" class="input-addon" data-toggle-password="{{ id }}"
            aria-controls="{{ id }}">Show</button>
  </div>
  {% if hint %}<p class="hint">{{ hint }}</p>{% endif %}
</div>
{% endmacro %}
